[package]
name = "legion"
version = "0.4.0"
description = "High performance entity component system (ECS) library"
authors = ["Thomas Gillen <thomas.gillen@googlemail.com>"]
repository = "https://github.com/amethyst/legion"
keywords = ["ecs", "game"]
categories = ["game-engines", "data-structures"]
readme = "readme.md"
license = "MIT"
edition = "2024"
rust-version = "1.85"

[workspace]
members = ["codegen"]

# Lints shared by every crate in the workspace (opt in with `[lints] workspace = true`).
# CI runs clippy with `-D warnings`, so these are warnings locally and errors in CI.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
# unused_qualifications = "warn" # to many false positives
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
# unused_macro_rules = "warn" # minor
unit_bindings = "warn"
let_underscore_drop = "warn"
explicit_outlives_requirements = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
invalid_rust_codeblocks = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Leftover debugging / unfinished code.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Unsafe-code hygiene.
missing_safety_doc = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
borrow_as_ptr = "warn"
ref_as_ptr = "warn"
ptr_as_ptr = "warn"
cast_ptr_alignment = "warn"
transmute_ptr_to_ptr = "warn"
# Avoid accidental refcount-bump ambiguity.
clone_on_ref_ptr = "warn"

[lints]
workspace = true

[features]
default = ["parallel", "serialize", "codegen", "events"]
parallel = ["rayon"]
# Entity events: `World::subscribe`, and the `Event`, `EventSender`, `Subscriber` and `Subscribers` types.
# Without it, archetypes carry no subscriber list and never send notifications.
events = []
extended-tuple-impls = []
# Exposes the `legion::internals` module: the building blocks legion is made of, for people writing their own ECS.
# Unstable: items there may change or disappear in any release.
internals = []
serialize = ["serde", "erased-serde", "uuid/serde", "scoped-tls-hkt"]

codegen = ["legion_codegen"]
wasm-bindgen = ["uuid/js"]

[dependencies]
legion_codegen = { path = "codegen", version = "0.4.0", optional = true }
smallvec = "1.16"
itertools = "0.15"
downcast-rs = "2.0"
paste = "1.0.15"
parking_lot = "0.12"
bit-set = "0.11"
thiserror = "2.0"
uuid = { version = "1.26", features = ["v4"] }
rayon = { version = "1.12", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
scoped-tls-hkt = { version = "0.1", optional = true }
erased-serde = { version = "0.4", optional = true }

atomic_refcell = "0.1.14"

[dev-dependencies]
serde_json = "1.0"
bincode = "1.3"
criterion = "0.7"
cgmath = "0.18"
trybuild = "1.0"

[[bench]]
name = "benchmarks"
harness = false

[[bench]]
name = "parallel_query"
harness = false
required-features = ["parallel"]

[[bench]]
name = "transform"
harness = false
required-features = ["parallel"]

[[bench]]
name = "insertion"
harness = false

[[example]]
name = "append_only"
required-features = ["internals"]
test = true

[[test]]
name = "codegen"
required-features = ["codegen"]

[[test]]
name = "internals"
required-features = ["internals"]

[[test]]
name = "internals_events"
required-features = ["internals", "events"]

[[test]]
name = "systems_par_for_each"
required-features = ["parallel"]
